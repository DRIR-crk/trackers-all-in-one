name: Update trackers

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays at 06:00 UTC
  workflow_dispatch:        # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild and live-test tracker lists
        env:
          CHECK_WORKERS: "300"
          CHECK_TIMEOUT: "6"
        run: bash scripts/update.sh

      - name: Commit refreshed lists
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trackers_all_in_one.txt trackers_best.txt README.md
          git commit -m "chore: weekly auto-refresh + live-tested best list"
          git push
